name = "flight-watch"
compatibility_date = "2025-01-01"
pages_build_output_dir = "."

# 部署後，去 Cloudflare Dashboard 建立一個 D1 database（例如 flight-watch-db），
# 把下面的 database_id 換成你自己的，binding 保持 DB 不要改（程式碼裡固定用 env.DB）。
# 這一段拿掉也沒關係——沒設定就等於「有 Token、沒有 D1」，程式會自動走安全鎖定。
#
[[d1_databases]]
binding = "DB"
database_name = "flight-watch-db"
database_id = "59adfc72-c56a-46f3-b0b3-e760f095c80f"
